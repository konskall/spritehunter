<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07111d" />
    <title>SpriteHunter — Εκτός σύνδεσης</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07111d; color: #eef7fb; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 20%, #173348, #07111d 55%); }
      main { width: min(430px, 100%); padding: 28px; border: 1px solid #24475a; border-radius: 20px; background: rgba(8,24,36,.94); text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0; color: #9eb1bd; font-size: 14px; line-height: 1.6; }
      button { margin-top: 22px; min-height: 44px; padding: 0 18px; border: 1px solid #7de4ca; border-radius: 999px; color: #07111d; background: #7de4ca; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/spritehunter-icon-192.png" alt="" />
      <h1>Δεν υπάρχει σύνδεση</h1>
      <p>Το SpriteHunter μπορεί να ανοίξει ως εφαρμογή, αλλά οι ζωντανοί χάρτες και οι νέες μετεωρολογικές μετρήσεις χρειάζονται Internet.</p>
      <button type="button" onclick="location.reload()">Νέα προσπάθεια</button>
    </main>
  </body>
</html>
